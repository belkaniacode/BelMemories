version: "3"

vars:
  # The version lives in wails.json (info.productVersion); the app embeds it.
  VERSION:
    sh: python3 -c "import json;print(json.load(open('wails.json'))['info']['productVersion'])"
  # WebKitGTK API used on Linux: "" for webkit2gtk-4.0, "webkit2_41" for webkit2gtk-4.1
  WEBKIT_TAGS: '{{.WEBKIT_TAGS | default "webkit2_41"}}'

env:
  GOTOOLCHAIN: local

tasks:
  dev:
    desc: Run the app in Wails dev mode (hot reload)
    cmds:
      - wails dev -tags "{{.WEBKIT_TAGS}}"

  test:
    desc: Run Go unit and integration tests
    cmds:
      - go test -race ./internal/...

  lint:
    desc: Static checks (Go vet for Linux and Windows, Svelte type check)
    cmds:
      - go vet ./...
      - GOOS=windows CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go vet ./internal/... || echo "skip windows vet (no mingw)"
      - cd frontend && npx svelte-check --tsconfig ./tsconfig.json

  models:fetch:
    desc: Download ONNX Runtime libraries (Linux + Windows) into models/lib
    cmds:
      - bash scripts/fetch-onnxruntime.sh all

  models:export:
    desc: Export the CLIP model into models/ (needs Python with torch; see docs/build.md)
    dir: tools/clip-export
    cmds:
      - python export.py

  icons:
    desc: Regenerate all app icons from a master PNG (task icons -- path/to/icon.png)
    cmds:
      - python tools/make-icons.py {{.CLI_ARGS}}

  install:linux:
    desc: Register the built app in the desktop menu with its icon (~/.local/share)
    deps: [build:linux]
    cmds:
      - scripts/install-linux.sh build/bin/BelMemories

  version:
    desc: Print the current app version (wails.json info.productVersion)
    cmds:
      - echo {{.VERSION}}

  release:
    desc: "Bump the version, commit and tag it: task release -- 1.2.0"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "usage: task release -- 1.2.0"
      - sh: echo "{{.CLI_ARGS}}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
        msg: "version must look like 1.2 or 1.2.0"
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "commit or stash your changes first"
    cmds:
      - python3 -c "import json,sys;p='wails.json';d=json.load(open(p));d['info']['productVersion']=sys.argv[1];open(p,'w').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')" {{.CLI_ARGS}}
      - git commit -am "chore: release v{{.CLI_ARGS}}"
      - git tag -a v{{.CLI_ARGS}} -m "BelMemories {{.CLI_ARGS}}"
      - echo "tagged v{{.CLI_ARGS}} — push with git push --follow-tags"

  build:linux:
    desc: Build Linux amd64 binary into build/bin/BelMemories
    cmds:
      - wails build -clean -platform linux/amd64 -tags "{{.WEBKIT_TAGS}}"

  build:windows:
    desc: Cross-build Windows amd64 .exe (needs mingw-w64-gcc because of cgo/onnxruntime)
    env:
      CGO_ENABLED: "1"
      CC: x86_64-w64-mingw32-gcc
      CXX: x86_64-w64-mingw32-g++
    cmds:
      - wails build -platform windows/amd64

  package:linux:
    desc: Build and assemble dist/BelMemories-linux (+ zip) with model and onnxruntime
    deps: [build:linux]
    cmds:
      - rm -rf dist/BelMemories-linux && mkdir -p dist/BelMemories-linux/models
      - cp build/bin/BelMemories dist/BelMemories-linux/
      - cp -r build/linux dist/BelMemories-linux/linux
      - cp scripts/install-linux.sh dist/BelMemories-linux/
      - cp models/clip-image.onnx models/clip-labels.json dist/BelMemories-linux/models/ || echo "WARN no CLIP model — rules-only build"
      - cp models/lib/linux/libonnxruntime.so dist/BelMemories-linux/ || echo "WARN no onnxruntime — rules-only build"
      - cd dist && rm -f BelMemories-linux.zip && zip -qr BelMemories-linux.zip BelMemories-linux

  package:windows:
    desc: Build and assemble dist/BelMemories-windows (+ zip) with model and onnxruntime.dll
    deps: [build:windows]
    cmds:
      - rm -rf dist/BelMemories-windows && mkdir -p dist/BelMemories-windows/models
      - cp build/bin/BelMemories.exe dist/BelMemories-windows/
      - cp models/clip-image.onnx models/clip-labels.json dist/BelMemories-windows/models/ || echo "WARN no CLIP model — rules-only build"
      - cp models/lib/windows/onnxruntime.dll dist/BelMemories-windows/ || echo "WARN no onnxruntime.dll — rules-only build"
      - cd dist && rm -f BelMemories-windows.zip && zip -qr BelMemories-windows.zip BelMemories-windows
